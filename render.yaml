services:
  - type: web
    name: roadready-api
    env: node
    plan: free
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # Comma-separated web origins allowed to call the API (e.g. https://roadready.vercel.app)
      - key: ALLOWED_ORIGINS
        sync: false
      # Bearer token for the owner dashboard at /admin (leave unset to disable)
      - key: ADMIN_TOKEN
        sync: false
      # Postgres connection string (Supabase pooler URI). Required: the server will not start without it.
      - key: DATABASE_URL
        sync: false
      # Supabase project URL, e.g. https://abcd.supabase.co (verifies sign-in tokens)
      - key: SUPABASE_URL
        sync: false
      # Only for projects still on the legacy JWT secret
      - key: SUPABASE_JWT_SECRET
        sync: false
      # Secret key used only to delete logins on account deletion
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Web payments (Stripe). See docs/PAYMENTS.md
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_MONTHLY
        sync: false
      - key: APP_URL
        sync: false
      # Monthly running costs for the /admin profit dashboard
      - key: MONTHLY_COSTS_USD
        value: 75
      # App Store / Google Play purchases (RevenueCat)
      - key: REVENUECAT_SECRET_KEY
        sync: false
      - key: REVENUECAT_WEBHOOK_AUTH
        sync: false
