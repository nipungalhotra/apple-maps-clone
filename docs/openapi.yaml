openapi: 3.0.3
info:
  title: RoadReady REST API
  description: Production-grade REST API powering the RoadReady safe driving grounds, real-time traffic telemetry, and DMV test preparation platform.
  version: 1.0.0
servers:
  - url: http://127.0.0.1:3001
    description: Local / Docker production server
# Callers are identified by a Supabase access token (signed-in user) or, for guests,
# by a random device id. Endpoints that store per-person data need one of the two.
security:
  - bearerAuth: []
  - clientId: []
paths:
  /api/health:
    get:
      summary: Health Check
      description: Returns service health, uptime, and current environment.
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: RoadReady API
                  database:
                    type: string
                    enum: [ok, unavailable]
                  accounts:
                    type: string
                    enum: [enabled, disabled]
                  uptimeSeconds:
                    type: integer
                    example: 3600
                  timestamp:
                    type: string
                    format: date-time
                  environment:
                    type: string
                    example: production

  /api/traffic:
    get:
      summary: Real-Time Traffic & Incidents
      description: Returns synthesized traffic vectors and active incidents for the given coordinates.
      parameters:
        - name: lat
          in: query
          schema:
            type: number
            default: 37.7749
        - name: lng
          in: query
          schema:
            type: number
            default: -122.4194
      responses:
        '200':
          description: GeoJSON FeatureCollection of traffic segments and list of incidents.

  /api/passport:
    get:
      summary: Get Driver Passport
      description: Retrieves logged practice hours, targets, and unlocked milestone badges.
      responses:
        '200':
          description: Passport data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passport'

  /api/passport/log:
    post:
      summary: Log Practice Session
      description: Logs a supervised practice session for the caller (account or guest device). This is a personal record, not an official log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hours:
                  type: number
                  default: 1
                isNight:
                  type: boolean
                  default: false
                isHighway:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Hour logged successfully.

  /api/community-reports:
    get:
      summary: List Ground Reports
      parameters:
        - name: zoneId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of reports.
    post:
      summary: Submit Ground Report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunityReportInput'
      responses:
        '201':
          description: Report created.
        '400':
          description: Invalid input or missing fields.

  /api/subscription:
    get:
      summary: Get Subscription Status
      responses:
        '200':
          description: Current subscription details.

  /api/subscription/upgrade:
    post:
      summary: Upgrade to Pro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tier:
                  type: string
                  enum: [lifetime, monthly]
      responses:
        '200':
          description: Subscription upgraded (simulated checkout; the price is set by the server).
        '401':
          description: Sign-in required (code sign_in_required).
        '501':
          description: Payments are not configured on this server (production).

  /api/payments/config:
    get:
      summary: Payment options available on this server
      security: []
      responses:
        '200':
          description: Plans and which payment providers are configured.

  /api/payments/stripe/checkout:
    post:
      summary: Start a Stripe Checkout (web)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plan: { type: string, enum: [lifetime, monthly] }
      responses:
        '200': { description: 'Checkout URL to open: { url }' }
        '401': { description: Sign-in required. }
        '409': { description: Plan already owned (code already_owned). }
        '501': { description: Web payments not configured. }

  /api/payments/stripe/confirm:
    post:
      summary: Confirm a finished checkout from the return page
      security:
        - bearerAuth: []
      responses:
        '200': { description: Current subscription. }
        '403': { description: The checkout belongs to another account. }

  /api/payments/stripe/portal:
    post:
      summary: Stripe customer portal link (manage or cancel a web plan)
      security:
        - bearerAuth: []
      responses:
        '200': { description: 'Portal URL: { url }' }
        '404': { description: No web purchase for this account. }

  /api/payments/stripe/webhook:
    post:
      summary: Stripe webhook (signature verified)
      security: []
      responses:
        '200': { description: Processed (or a duplicate). }
        '400': { description: Invalid signature. }

  /api/payments/revenuecat/sync:
    post:
      summary: Re-check App Store / Google Play purchases with RevenueCat
      security:
        - bearerAuth: []
      responses:
        '200': { description: Current subscription. }

  /api/payments/revenuecat/webhook:
    post:
      summary: RevenueCat webhook (shared Authorization header)
      security: []
      responses:
        '200': { description: Processed (or a duplicate). }
        '401': { description: Wrong or missing Authorization header. }

  /api/account:
    get:
      summary: Current account
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The signed-in account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  email: { type: string }
                  createdAt: { type: string, format: date-time }
        '401':
          description: Not signed in.
    delete:
      summary: Delete account
      description: Permanently deletes the caller's hours, plan, reports, booking requests and login.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account deleted.
        '502':
          description: Data deleted but removing the login failed; safe to retry.
        '503':
          description: Account deletion is not configured on this server.

  /api/account/claim:
    post:
      summary: Move guest data into the account
      description: Moves the device's guest data (identified by X-Client-Id) into the signed-in account. Safe to call repeatedly.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Guest data moved; returns the account's passport and subscription.
        '400':
          description: Missing X-Client-Id.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth access token.
    clientId:
      type: apiKey
      in: header
      name: X-Client-Id
      description: Random per-device id for guests (16-64 characters, letters, digits, _ or -).
  schemas:
    Passport:
      type: object
      properties:
        loggedHours:
          type: number
          example: 18
        targetHours:
          type: number
          example: 50
        nightHours:
          type: number
          example: 5
        highwayHours:
          type: number
          example: 3
        badges:
          type: array
          items:
            type: string
          example: ["First Ignition", "Cone Wizard"]

    CommunityReportInput:
      type: object
      required:
        - zoneId
        - notes
      properties:
        zoneId:
          type: string
          example: candlestick-open-ground
        author:
          type: string
          example: Marcus V.
        status:
          type: string
          example: Gate Open
        surface:
          type: string
          example: Clean
        notes:
          type: string
          example: Completely empty right now.
