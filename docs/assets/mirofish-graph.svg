<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071e3" />
      <stop offset="100%" stop-color="#34c759" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#bg)" />

  <!-- Grid Dots -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.35" />
  </pattern>
  <rect width="960" height="540" fill="url(#grid)" />

  <!-- Title / Badge -->
  <rect x="40" y="32" width="460" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <circle cx="58" cy="49" r="6" fill="#34c759" />
  <text x="74" y="54" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">
    MiroFish Swarm Intelligence • GraphRAG Multi-Agent Topology
  </text>
  <text x="920" y="54" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Mono', monospace" font-size="12" fill="#94a3b8">
    72h Simulation • 86 Events • 100% Convergence
  </text>

  <!-- Relationship Edges (SVG paths) -->
  <!-- Center to Student -->
  <line x1="480" y1="270" x2="220" y2="170" stroke="#475569" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)" />
  <rect x="290" y="196" width="120" height="22" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="350" y="211" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">HELPS_PRACTICE</text>

  <!-- Center to Parent -->
  <line x1="480" y1="270" x2="220" y2="380" stroke="#475569" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)" />
  <rect x="285" y="328" width="130" height="22" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="350" y="343" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">SUPERVISES & VERIFIES</text>

  <!-- Center to Instructor -->
  <line x1="480" y1="270" x2="740" y2="170" stroke="#475569" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)" />
  <rect x="550" y="196" width="140" height="22" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="620" y="211" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">COACH MARKETPLACE</text>

  <!-- Center to DMV -->
  <line x1="480" y1="270" x2="740" y2="380" stroke="#475569" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)" />
  <rect x="555" y="328" width="130" height="22" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="620" y="343" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">FORM DL-50HRS LOG</text>

  <!-- Cross link: Instructor to Student -->
  <path d="M 720 190 Q 480 90 240 150" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="3 3" />
  <text x="480" y="112" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#818cf8">DUAL-CONTROL TRAINING ($75/hr)</text>

  <!-- Center Core Node: RoadReady TechPlatform -->
  <g transform="translate(480, 270)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="70" fill="#1e293b" stroke="url(#coreGlow)" stroke-width="3" />
    <circle cx="0" cy="0" r="54" fill="#0f172a" opacity="0.9" />
    <text x="0" y="-8" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff">RoadReady</text>
    <text x="0" y="12" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">TechPlatform</text>
    <text x="0" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" fill="#94a3b8">Core Engine</text>
  </g>

  <!-- Node 1: StudentDriver -->
  <g transform="translate(200, 160)" filter="url(#shadow)">
    <rect x="-85" y="-38" width="170" height="76" rx="14" fill="#1e293b" stroke="#f97316" stroke-width="2" />
    <circle cx="-55" cy="0" r="16" fill="#ea580c" opacity="0.25" />
    <text x="-55" y="5" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14">🎓</text>
    <text x="15" y="-8" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#fdba74">StudentDriver</text>
    <text x="15" y="10" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">High School & Beginners</text>
    <text x="15" y="24" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" fill="#34c759">$29.99 Pro Pass</text>
  </g>

  <!-- Node 2: Parent -->
  <g transform="translate(200, 390)" filter="url(#shadow)">
    <rect x="-85" y="-38" width="170" height="76" rx="14" fill="#1e293b" stroke="#ef4444" stroke-width="2" />
    <circle cx="-55" cy="0" r="16" fill="#dc2626" opacity="0.25" />
    <text x="-55" y="5" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14">🛡️</text>
    <text x="15" y="-8" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#fca5a5">Parent</text>
    <text x="15" y="10" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">Safety & Liability</text>
    <text x="15" y="24" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" fill="#38bdf8">Peace of Mind Logbook</text>
  </g>

  <!-- Node 3: DrivingInstructor -->
  <g transform="translate(760, 160)" filter="url(#shadow)">
    <rect x="-95" y="-38" width="190" height="76" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="2" />
    <circle cx="-62" cy="0" r="16" fill="#9333ea" opacity="0.25" />
    <text x="-62" y="5" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14">🚗</text>
    <text x="15" y="-8" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#d8b4fe">DrivingInstructor</text>
    <text x="15" y="10" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">Behind-the-Wheel Pros</text>
    <text x="15" y="24" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" fill="#eab308">$30 Marketplace Lead Fee</text>
  </g>

  <!-- Node 4: DMVAgency -->
  <g transform="translate(760, 390)" filter="url(#shadow)">
    <rect x="-95" y="-38" width="190" height="76" rx="14" fill="#1e293b" stroke="#eab308" stroke-width="2" />
    <circle cx="-62" cy="0" r="16" fill="#ca8a04" opacity="0.25" />
    <text x="-62" y="5" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14">🏛️</text>
    <text x="15" y="-8" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#fde047">DMVAgency</text>
    <text x="15" y="10" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">Field Operations</text>
    <text x="15" y="24" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" fill="#34c759">Form DL-50HRS Compliance</text>
  </g>

  <!-- Bottom Legend Footer -->
  <rect x="180" y="485" width="600" height="34" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <circle cx="210" cy="502" r="5" fill="#f97316" /><text x="222" y="506" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">Student</text>
  <circle cx="310" cy="502" r="5" fill="#ef4444" /><text x="322" y="506" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">Parent</text>
  <circle cx="410" cy="502" r="5" fill="#a855f7" /><text x="422" y="506" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">Instructor</text>
  <circle cx="510" cy="502" r="5" fill="#eab308" /><text x="522" y="506" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">DMV Agency</text>
  <circle cx="620" cy="502" r="5" fill="#38bdf8" /><text x="632" y="506" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">Platform</text>
</svg>
